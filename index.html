function buildRecent(){
  const recent = DATA.filter(e => e.d).slice()
    .sort((a,b) => b.d.localeCompare(a.d)).slice(0, RECENT_N);
  const sec = document.createElement('section');
  sec.id = 'recent';
  sec.dataset.cat = '__recent__';
  sec.innerHTML = `<div class="sec-h"><span class="dot" style="background:#0ea5e9"></span>
    <h2>🆕 最新加入</h2><span class="cnt">${recent.length} 項 · 最近儲存</span></div>
    <div class="rlist">${recent.map(recentRowHtml).join('')}</div>`;
  secRoot.appendChild(sec);
}

function buildSection(id, icon, name, color, items){
  const sec = document.createElement('section');
  sec.id = id;
  sec.dataset.cat = name;
  sec.innerHTML = `<div class="sec-h"><span class="dot" style="background:${color}"></span>
    <h2>${icon} ${escapeHtml(name)}</h2><span class="cnt">${items.length} 項</span></div>`;
  sec.style.setProperty('--cc', color);
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.innerHTML = items.map(cardHtml).join('');
  sec.appendChild(grid);
  secRoot.appendChild(sec);
}

let io = null;
function attachObserver(){
  if (io) io.disconnect();
  io = new IntersectionObserver(en => {
    for (const x of en) {
      if (!x.isIntersecting) continue;
      const el = x.target;
      if (el.dataset.src && !el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.loading = 'lazy';
        f.src = el.dataset.src;
        f.setAttribute('allowfullscreen','');
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  }, { rootMargin: '800px' });
  document.querySelectorAll('.frame[data-src]').forEach(el => io.observe(el));
}

function applyFilter(){
  const q = qInput.value.trim().toLowerCase();
  const searching = q.length > 0;
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('hidden', searching && !c.dataset.title.includes(q)));
  document.querySelectorAll('#sections > section').forEach(s => {
    const cat = s.dataset.cat;
    if (searching) {
      if (cat === '__recent__') { s.classList.add('hidden'); return; }
      s.classList.toggle('hidden', !s.querySelector('.card:not(.hidden)'));
    } else {
      const show = cat === '__recent__' || activeCat === 'all' || activeCat === cat;
      s.classList.toggle('hidden', !show);
    }
  });
}

function setCat(cat){
  activeCat = cat;
  localStorage.setItem('galCat', cat);
  document.querySelectorAll('.chip[data-cat]').forEach(ch =>
    ch.classList.toggle('active', ch.dataset.cat === cat));
  applyFilter();
  window.scrollTo({ top: 0 });
}

function render(){
  secRoot.innerHTML = '';
  buildRecent();
  for (const cat of CATS) {
    const items = sortItems(DATA.filter(e => e.c === cat));
    if (!items.length) continue;
    const meta = CAT_META[cat] || ['📌','#78716c'];
    buildSection('cat-' + cat.replace(/\s+/g,'-'), meta[0], cat, meta[1], items);
  }
  sortBtn.textContent = sortDir === 'new' ? '📅 日期：新 → 舊' : '📅 日期：舊 → 新';
  applyFilter();
  attachObserver();
}

document.querySelectorAll('.chip[data-cat]').forEach(ch => {
  ch.addEventListener('click', () => setCat(ch.dataset.cat));
  ch.classList.toggle('active', ch.dataset.cat === activeCat);
});

sortBtn.addEventListener('click', () => {
  sortDir = sortDir === 'new' ? 'old' : 'new';
  localStorage.setItem('galSort', sortDir);
  render();
});
const qClear = document.getElementById('qClear');
qInput.addEventListener('input', () => {
  qClear.style.display = qInput.value ? 'block' : 'none';
  applyFilter();
});
qClear.addEventListener('click', () => {
  qInput.value = ''; qClear.style.display = 'none'; applyFilter(); qInput.focus();
});

// Dark mode
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('galTheme') ||
  (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(){
  document.documentElement.classList.toggle('dark', theme === 'dark');
  themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name="theme-color"]')
    .setAttribute('content', theme === 'dark' ? '#15130f' : '#faf8f5');
}
themeBtn.addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('galTheme', theme);
  applyTheme();
});
applyTheme();

// Back to top
const toTop = document.getElementById('toTop');
addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 600), { passive:true });
toTop.addEventListener('click', () => scrollTo({ top:0, behavior:'smooth' }));

render();
</script>
</body>
</html>
